name: Deploy static preview

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and module
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}" -o /tmp/pages-index.html
          grep -Fq 'Threshold Screening' /tmp/pages-index.html
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}audit.mjs" -o /tmp/audit.mjs
          grep -Fq 'export function evaluateAudit' /tmp/audit.mjs
