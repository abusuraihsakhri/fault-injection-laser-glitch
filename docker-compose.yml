version: '3.8'

services:
  fault-injection-laser-glitch:
    build: .
    container_name: fault-injection-laser-glitch
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=fault-injection-laser-glitch-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
