[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-injection-laser-glitch"
version = "2.0.0"
description = "Clock Glitch & Differential Fault Analysis (DFA) Resistance Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
fault-injection-laser-glitch = "fault_injection.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fault-injection-laser-glitch"
Repository = "https://github.com/abusuraihsakhri/fault-injection-laser-glitch.git"

[tool.setuptools.packages.find]
include = ["agents*", "fault_injection*"]
